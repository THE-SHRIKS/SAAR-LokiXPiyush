[package]
name = "opendeck"
version = "0.1.0"
description = "Air-Gapped Offline Financial Intelligence Workspace"
authors = ["THE SHRIKS"]
edition = "2021"

[lib]
name = "opendeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
argon2 = { version = "0.5.3", features = ["std", "alloc"] }
rand = "0.8.5"
zeroize = { version = "1.8.1", features = ["derive"] }
sha2 = "0.10.8"
aes-gcm = "0.10.3"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
directories = "6.0.0"
thiserror = "2.0.11"
rusqlite = { version = "0.33", features = ["bundled"] }
base64 = "0.23"
anyhow = "1.0"
hex = "0.4"
regex = "1.13"

[profile.dev]
incremental = true

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
